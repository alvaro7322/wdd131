<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Product review form for WDD131 course assignment.">
    <meta name="author" content="Alvaro Garcia">
    <title>Product Review Form</title>
    <link rel="stylesheet" href="styles/form.css">
    <script src="scripts/form.js" defer></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>

    <header>
        <h1>Product Review</h1>
    </header>

    <main>
        <form method="get" action="review.html">
            
            <label for="productName">Product Name</label>
            <select id="productName" name="productName" required>
                <option value="" disabled selected>Select a Product ...</option>
            </select>

            <fieldset>
                <legend>Overall Rating</legend>
                <div class="rating">
                    <input type="radio" id="star1" name="rating" value="1" required>
                    <label for="star1">☆ 1</label>

                    <input type="radio" id="star2" name="rating" value="2" required>
                    <label for="star2">☆ 2</label>

                    <input type="radio" id="star3" name="rating" value="3" required>
                    <label for="star3">☆ 3</label>

                    <input type="radio" id="star4" name="rating" value="4" required>
                    <label for="star4">☆ 4</label>

                    <input type="radio" id="star5" name="rating" value="5" required>
                    <label for="star5">☆ 5</label>
                </div>
            </fieldset>

            <label for="installDate">Date of Installation</label>
            <input type="date" id="installDate" name="installDate" required>

            <fieldset>
                <legend>Which features did you find useful? (Check all that apply)</legend>

                <input type="checkbox" id="feature1" name="features" value="durability">
                <label for="feature1">Durability</label>

                <input type="checkbox" id="feature2" name="features" value="ease-of-use">
                <label for="feature2">Ease of Use</label>

                <input type="checkbox" id="feature3" name="features" value="performance">
                <label for="feature3">Performance</label>

                <input type="checkbox" id="feature4" name="features" value="design">
                <label for="feature4">Design</label>
            </fieldset>

            <label for="writtenReview">Written Review (Optional)</label>
            <textarea id="writtenReview" name="writtenReview" rows="4"></textarea>

            <label for="userName">Your Name (Optional)</label>
            <input type="text" id="userName" name="userName">

            <input type="submit" value="Post Review">

        </form>
    </main>

    <footer>
        <p>
            &copy; <span id="currentyear"></span> Alvaro Garcia, Peru
        </p>

        <p id="lastModified"></p>     
    </footer>

</body>
</html>
